name: Appwrite Keepalive

on:
  schedule:
    # 每天 UTC 00:00（台灣時間 08:00）自動執行一次
    - cron: '0 0 * * *'
  # 允許在 GitHub 頁面手動點擊觸發測試
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Appwrite Health Endpoint
        env:
          APPWRITE_ENDPOINT: ${{ secrets.APPWRITE_ENDPOINT }}
          APPWRITE_PROJECT_ID: ${{ secrets.APPWRITE_PROJECT_ID }}
        run: |
          # 檢查環境變數是否設定
          if [ -z "$APPWRITE_ENDPOINT" ] || [ -z "$APPWRITE_PROJECT_ID" ]; then
            echo "錯誤：缺少必要的 GitHub Secrets (APPWRITE_ENDPOINT 或 APPWRITE_PROJECT_ID)"
            exit 1
          fi

          # 移除網址末端可能多帶的斜線
          CLEAN_ENDPOINT="${APPWRITE_ENDPOINT%/}"

          echo "正在呼叫 Appwrite 健康檢查端點..."
          
          # 發出請求至 Appwrite /health 端點
          HTTP_STATUS=$(curl -s -o response.txt -w "%{http_code}" \
            -X GET "$CLEAN_ENDPOINT/health" \
            -H "X-Appwrite-Project: $APPWRITE_PROJECT_ID")

          echo "HTTP 回應碼: $HTTP_STATUS"
          echo "回應內容: $(cat response.txt)"

          # 只要回傳 200 即代表存取成功
          if [ "$HTTP_STATUS" -eq 200 ]; then
            echo "成功喚醒 / 維持 Appwrite 活躍狀態！"
          else
            echo "警告：請求未返回 200，請檢查 Endpoint 與 Project ID 是否正確。"
            exit 1
          fi
