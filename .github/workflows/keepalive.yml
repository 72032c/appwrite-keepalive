name: Appwrite Keepalive

on:
  schedule:
    # 每 5 天的 UTC 00:00 (台灣時間 08:00) 自動跑一次
    - cron: "0 0 */5 * *"
  # 支援手動觸發測試
  workflow_dispatch:

jobs:
  keepalive:
    name: Send Heartbeat
    runs-on: ubuntu-latest

    steps:
      - name: Ping Appwrite Service
        env:
          APPWRITE_ENDPOINT: ${{ secrets.APPWRITE_ENDPOINT }}
          APPWRITE_PROJECT_ID: ${{ secrets.APPWRITE_PROJECT_ID }}
        run: |
          # 檢查 Secrets
          if [ -z "$APPWRITE_ENDPOINT" ] || [ -z "$APPWRITE_PROJECT_ID" ]; then
            echo "::error::缺少 GitHub Secrets (APPWRITE_ENDPOINT 或 APPWRITE_PROJECT_ID)！"
            exit 1
          fi

          CLEAN_ENDPOINT="${APPWRITE_ENDPOINT%/}"
          echo "目標網址: $CLEAN_ENDPOINT/locale"

          # 送出請求
          HTTP_STATUS=$(curl -s -o response.txt -w "%{http_code}" \
            -X GET "$CLEAN_ENDPOINT/locale" \
            -H "X-Appwrite-Project: $APPWRITE_PROJECT_ID")

          echo "HTTP 狀態碼: $HTTP_STATUS"
          echo "伺服器回應: $(cat response.txt)"

          if [ "$HTTP_STATUS" -eq 200 ]; then
            echo "✅ 成功喚醒 Appwrite 專案！"
          else
            echo "::error::請求失敗，狀態碼為 $HTTP_STATUS"
            exit 1
          fi
