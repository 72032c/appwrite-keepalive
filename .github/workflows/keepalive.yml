name: Appwrite Keepalive

on:
  schedule:
    # 每 5 天的 UTC 00:00 (台灣時間 08:00) 執行一次
    - cron: "0 0 */5 * *"
  # 支援手動觸發
  workflow_dispatch:

jobs:
  keepalive:
    name: Send Heartbeat
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Run keepalive
        run: bun run keepalive
        env:
          APPWRITE_ENDPOINT: ${{ secrets.APPWRITE_ENDPOINT }}
          APPWRITE_PROJECT_ID: ${{ secrets.APPWRITE_PROJECT_ID }}
          APPWRITE_API_KEY: ${{ secrets.APPWRITE_API_KEY }}
          APPWRITE_PROJECTS: ${{ secrets.APPWRITE_PROJECTS }}
